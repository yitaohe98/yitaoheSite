{{ define "main" }}
  <section class="section">
    <div class="container">
      <header class="page-header">
        <h1 class="page-title">{{ .Title }}</h1>
        {{ with .Params.description }}
          <p class="page-subtitle">{{ . }}</p>
        {{ end }}
      </header>

      <div class="page-content">
        {{ .Content }}
      </div>
    </div>
  </section>
{{ end }}
